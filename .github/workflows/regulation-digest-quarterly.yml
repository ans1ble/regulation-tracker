name: regulation-digest-quarterly

on:
  schedule:
    - cron: "0 2 1 1,4,7,10 *"   # 每季度首月 1 日 02:00 UTC（北京时间 10:00），汇总上一季度
  workflow_dispatch: {}    # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  quarterly-rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set previous quarter (Asia/Shanghai)
        run: |
          export TZ=Asia/Shanghai
          NOW_YEAR=$(date +%Y)
          NOW_MONTH=$(date +%-m)
          if [ "$NOW_MONTH" -le 3 ]; then
            PREV_YEAR=$((NOW_YEAR-1)); Q=4
          else
            PREV_YEAR=$NOW_YEAR; Q=$(( (NOW_MONTH-1)/3 ))
          fi
          echo "PREV_YEAR=$PREV_YEAR" >> "$GITHUB_ENV"
          echo "Q=$Q" >> "$GITHUB_ENV"
          echo "QUARTERLY_DIR=reports/$PREV_YEAR/quarterly" >> "$GITHUB_ENV"
          echo "QUARTERLY_PATH=reports/$PREV_YEAR/quarterly/regulation-digest-$PREV_YEAR-Q$Q.md" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Write OpenCode provider config
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "0815": {
                "models": {
                  "agnes-2.5-flash": { "name": "" }
                },
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "apiKey": "{env:AGNES_API_KEY}",
                  "baseURL": "https://apihub.agnes-ai.com/v1",
                  "setCacheKey": true
                }
              }
            }
          }
          EOF

      - name: Generate quarterly rollup from weekly/monthly reports (offline)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          export TZ=Asia/Shanghai
          mkdir -p "$QUARTERLY_DIR"
          PROMPT="你是法规追踪助手，请生成本季度汇总。步骤：1) 读取 regulation-tracker/SKILL.md；2) 读取目录 reports/${{ env.PREV_YEAR }}/weekly/ 与 reports/${{ env.PREV_YEAR }}/monthly/ 下的全部报告；3) 从中筛选报告日期落在 ${{ env.PREV_YEAR }} 年第 ${{ env.Q }} 季度（Q${{ env.Q }}：1-3月 / 4-6月 / 7-9月 / 10-12月）的条目；4) 按市场（参照 SKILL.md 追踪范围表）合并为季度汇总，写入 ${{ env.QUARTERLY_PATH }}，保留来源链接与生效日期，并标注本季度内即将/已生效的关键节点；5) 若某周/月缺报告，如实标注缺失；6) 这是基于已有报告的离线聚合，禁止联网搜索、禁止编造；7) 全程无人值守。"
          set +e
          echo "== 主模型 opencode/hy3-free（免费）=="
          opencode run --pure --auto --model opencode/hy3-free "$PROMPT"
          if [ ! -f "$QUARTERLY_PATH" ] && [ -n "$AGNES_API_KEY" ]; then
            echo "== hy3 未产出，切换到 0815 兜底模型 =="
            opencode run --pure --auto --model 0815/agnes-2.5-flash "$PROMPT"
          fi
        timeout-minutes: 60

      - name: Ensure quarterly report exists (fallback)
        if: always()
        run: |
          R="${{ env.QUARTERLY_PATH }}"
          if [ ! -f "$R" ]; then
            mkdir -p "$(dirname "$R")"
            echo "# 法规动态季度汇总生成失败 ${{ env.PREV_YEAR }}-Q${{ env.Q }}" > "$R"
            echo "" >> "$R"
            echo "OpenCode 本次未生成季度汇总，请检查 Actions 运行日志。" >> "$R"
          fi

      - name: Commit quarterly rollup
        if: always()
        run: |
          git config user.name "regulation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$QUARTERLY_DIR"
          if git diff --cached --quiet; then
            echo "本次无季度汇总变更，跳过提交"
          else
            git commit -m "chore: 法规季度汇总自动生成 ${{ env.PREV_YEAR }}-Q${{ env.Q }}"
            git fetch --unshallow >/dev/null 2>&1 || git fetch --deepen 100000 >/dev/null 2>&1
            git fetch origin master
            git checkout -- .
          git rebase origin/master
            git push origin HEAD:master
            echo "已推送季度汇总"
          fi
