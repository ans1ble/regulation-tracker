name: regulation-digest-annual

on:
  schedule:
    - cron: "0 3 1 1 *"   # 每年 1 月 1 日 03:00 UTC（北京时间 11:00），汇总上一年度
  workflow_dispatch: {}    # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  annual-rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set previous year (Asia/Shanghai)
        run: |
          export TZ=Asia/Shanghai
          PREV_YEAR=$(date -d "last year" +%Y)
          echo "PREV_YEAR=$PREV_YEAR" >> "$GITHUB_ENV"
          echo "ANNUAL_DIR=reports/$PREV_YEAR/annual" >> "$GITHUB_ENV"
          echo "ANNUAL_PATH=reports/$PREV_YEAR/annual/regulation-digest-$PREV_YEAR.md" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Write OpenCode provider config
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "0815": {
                "models": {
                  "agnes-2.5-flash": { "name": "" }
                },
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "apiKey": "{env:AGNES_API_KEY}",
                  "baseURL": "https://apihub.agnes-ai.com/v1",
                  "setCacheKey": true
                }
              }
            }
          }
          EOF

      - name: Generate annual rollup from existing reports (offline)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          export TZ=Asia/Shanghai
          mkdir -p "$ANNUAL_DIR"
          PROMPT="你是法规追踪助手，请生成 ${{ env.PREV_YEAR }} 年度法规回顾。步骤：1) 读取仓库根目录 SKILL.md；2) 读取目录 reports/${{ env.PREV_YEAR }}/ 下全部报告（weekly/、monthly/、quarterly/ 若有）；3) 按市场（参照 SKILL.md 追踪范围表 16 个市场）与法规类型（产品安全/无线/电池/化学/能效/AI）梳理全年关键动态，写入 ${{ env.ANNUAL_PATH }}，保留来源链接与生效日期；4) 提炼『年度关键生效节点』与『下一年度待办/预警』两节；5) 若部分周/月/季度报告缺失，如实标注；6) 这是基于已有报告的离线聚合，禁止联网搜索、禁止编造；7) 全程无人值守。"
          set +e
          echo "== 主模型 opencode/hy3-free（免费）=="
          opencode run --pure --auto --model opencode/hy3-free "$PROMPT"
          if [ ! -f "$ANNUAL_PATH" ] && [ -n "$AGNES_API_KEY" ]; then
            echo "== hy3 未产出，切换到 0815 兜底模型 =="
            opencode run --pure --auto --model 0815/agnes-2.5-flash "$PROMPT"
          fi
        timeout-minutes: 60

      - name: Ensure annual report exists (fallback)
        if: always()
        run: |
          R="${{ env.ANNUAL_PATH }}"
          if [ ! -f "$R" ]; then
            mkdir -p "$(dirname "$R")"
            echo "# 法规动态年度汇总生成失败 ${{ env.PREV_YEAR }}" > "$R"
            echo "" >> "$R"
            echo "OpenCode 本次未生成年度汇总，请检查 Actions 运行日志。" >> "$R"
          fi

      - name: Commit annual rollup
        if: always()
        run: |
          git config user.name "regulation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$ANNUAL_DIR" memory/
          if git diff --cached --quiet; then
            echo "本次无年度汇总变更，跳过提交"
          else
            git commit -m "chore: 法规年度汇总自动生成 ${{ env.PREV_YEAR }}"
            git fetch --unshallow >/dev/null 2>&1 || git fetch --deepen 100000 >/dev/null 2>&1
            git fetch origin master
            git checkout -- .
          git rebase origin/master
            git push origin HEAD:master
            echo "已推送年度汇总"
          fi
