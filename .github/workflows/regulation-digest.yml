name: regulation-digest-daily

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 01:00 UTC（北京时间 09:00）
  workflow_dispatch: {}    # 允许在 Actions 页面手动触发

permissions:
  contents: write   # 用于自动将进化后的知识库/报告推回仓库

jobs:
  run-skill-and-send:
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: reports
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set report date (Asia/Shanghai)
        run: |
          export TZ=Asia/Shanghai
          echo "REPORT_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Write OpenCode provider config
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "0815": {
                "models": {
                  "agnes-2.5-flash": { "name": "" }
                },
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "apiKey": "{env:AGNES_API_KEY}",
                  "baseURL": "https://apihub.agnes-ai.com/v1",
                  "setCacheKey": true
                }
              }
            }
          }
          EOF

      - name: Run regulation-tracker skill (OpenCode)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          export TZ=Asia/Shanghai
          mkdir -p "$REPORT_DIR"
          PROMPT="你是法规追踪助手。请：1) 读取仓库根目录 SKILL.md 了解本 skill 的职责与结构；2) 以『全球扫描』模式联网检索最近一周全球 16 个主要市场的认证/法规动态（EU、US、CN、JP、KR、UK、DE、FR、IT、IN、BR、AU、CA、MX、SG、TW、HK 等），覆盖产品安全、无线电子、电池、RoHS/REACH、AI 监管等；3) 将结构化中文摘要写入 ${REPORT_DIR}/regulation-digest-${{ env.REPORT_DATE }}.md（含日期、地区、法规名称、影响、生效/废止时间、来源链接；不要编造日期或限额，未知标注『待核实』）；4) 如有更新，将新认知写入 memory/ 下 MEMORY.md 实现知识库进化；5) 全程无人值守，不要停下等人确认（SKILL.md 中的 CHECKPOINT 直接跳过）；6) 绝不编造数据。"
          set +e
          echo "== 主模型 opencode/hy3-free（免费）=="
          opencode run --pure --auto --model opencode/hy3-free "$PROMPT"
          if [ ! -f "$REPORT_DIR/regulation-digest-${{ env.REPORT_DATE }}.md" ] && [ -n "$AGNES_API_KEY" ]; then
            echo "== hy3 未产出报告，切换到 0815 兜底模型 =="
            opencode run --pure --auto --model 0815/agnes-2.5-flash "$PROMPT"
          elif [ ! -f "$REPORT_DIR/regulation-digest-${{ env.REPORT_DATE }}.md" ]; then
            echo "hy3 未产出报告且未配置 AGNES_API_KEY 兜底，结束。"
          fi
        timeout-minutes: 60

      - name: Ensure report exists (fallback on failure)
        if: always()
        run: |
          R="$REPORT_DIR/regulation-digest-${{ env.REPORT_DATE }}.md"
          if [ ! -f "$R" ]; then
            echo "# 法规动态摘要生成失败 ${{ env.REPORT_DATE }}" > "$R"
            echo "" >> "$R"
            echo "OpenCode 本次未生成报告文件，请检查 Actions 运行日志。" >> "$R"
          fi

      - name: Commit knowledge base evolution (自动进化)
        if: always()
        run: |
          git config user.name "regulation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次无知识库/报告变更，跳过提交"
          else
            git commit -m "chore: 法规知识库自动进化 ${{ env.REPORT_DATE }}"
            git fetch --unshallow >/dev/null 2>&1 || git fetch --deepen 100000 >/dev/null 2>&1
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
            echo "已推送进化后的知识库与报告"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulation-digest-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/regulation-digest-*.md

      - name: Send digest email (Brevo)
        if: false
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          python3 scripts/send-digest.py \
            "$REPORT_DIR/regulation-digest-${{ env.REPORT_DATE }}.md" \
            "法规动态摘要 ${{ env.REPORT_DATE }}" \
            "$DIGEST_TO" \
            "法规动态追踪"
